<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Alicorn Adventures</title>
    <meta name="theme-color" content="#2b1f4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alicorn" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #2b1f4a; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      /* iPad: no zooming, scroll bounce, long-press menus or text selection. */
      html, body { position: fixed; inset: 0; overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; position: fixed; inset: 0; z-index: 100; flex-direction: column; align-items: center; justify-content: center; background: #2b1f4a; color: #ffd6f0; font-family: 'Baloo 2', sans-serif; font-weight: 800; text-align: center; padding: 24px; }
        #rotate div { font-size: 120px; animation: spin90 2s ease-in-out infinite; }
        #rotate p { font-size: 32px; }
      }
      @keyframes spin90 { 50% { transform: rotate(90deg); } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div>🔄</div><p>Turn your iPad sideways to play!</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
